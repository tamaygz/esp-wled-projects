; WLED platformio_override.ini — project-specific build
; Copy this alongside the WLED repo's platformio.ini

[env:esp32dev_project]
extends = env:esp32dev

custom_usermods =
  audioreactive
  ; Temperature
  ; rotary_encoder_ui
  ; four_line_display_UI

build_flags =
  ${env:esp32dev.build_flags}
  ; -D WLED_AP_PASS="your-ap-password"
  ; -D WLED_WIFI_SSID="your-ssid"
  ; -D LEDPIN=2
  ; -D BTNPIN=0
