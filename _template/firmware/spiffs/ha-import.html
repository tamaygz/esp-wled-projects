<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HA Import Assistant</title>
  <style>
    :root {
      --accent: #1976d2;
      --ok: #388e3c;
      --warn: #f57c00;
      --bg: #f5f5f5;
      --card: #ffffff;
      --border: #e0e0e0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: #212121; padding: 1rem; }
    h1 { font-size: 1.4rem; color: var(--accent); margin-bottom: 0.25rem; }
    .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .card h2 { font-size: 1rem; margin-bottom: 0.75rem; color: #424242; }
    .entity-row { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0; border-bottom: 1px solid var(--border); font-size: 0.875rem; gap: 0.5rem; }
    .entity-row:last-child { border-bottom: none; }
    .entity-label { color: #757575; min-width: 100px; }
    .entity-id { font-family: monospace; background: #f3f4f6; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
    .entity-id:hover { background: #e3f2fd; }
    .copy-hint { font-size: 0.75rem; color: #9e9e9e; }
    .blueprint-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--border); gap: 0.5rem; }
    .blueprint-row:last-child { border-bottom: none; }
    .bp-name { font-size: 0.875rem; flex: 1; }
    .bp-desc { font-size: 0.8rem; color: #757575; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 500; text-decoration: none; cursor: pointer; border: none; transition: opacity .15s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .btn-success { background: var(--ok); color: #fff; }
    .status { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 500; }
    .status-ok { background: #e8f5e9; color: var(--ok); }
    .status-warn { background: #fff3e0; color: var(--warn); }
    .notice { font-size: 0.8rem; color: #757575; margin-top: 0.75rem; padding: 0.5rem; background: #f9f9f9; border-radius: 4px; }
    .notice a { color: var(--accent); }
    #loading { text-align: center; padding: 2rem; color: #757575; }
    #error-msg { background: #ffebee; border: 1px solid #ffcdd2; border-radius: 8px; padding: 1rem; color: #c62828; display: none; }
    .step-num { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; background: var(--accent); color: #fff; border-radius: 50%; font-size: 0.75rem; font-weight: 600; margin-right: 6px; }
    .steps { list-style: none; }
    .steps li { padding: 0.4rem 0; font-size: 0.875rem; }
  </style>
</head>
<body>

<h1>&#x1F3E0; Home Assistant Import Assistant</h1>
<p class="subtitle">Reads your WLED device config to help you set up Home Assistant automations.</p>

<div id="loading">Connecting to WLED device&hellip;</div>
<div id="error-msg"></div>
<div id="main" style="display:none"></div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// PROJECT CONFIG — edit this section per project
// ─────────────────────────────────────────────────────────────────────────────
const PROJECT = {
  name: "[Project Name]",
  repoBase: "https://raw.githubusercontent.com/tamaygz/esp-wled-projects/main/[project]",
  blueprints: [
    // Add entries like:
    // { name: "Sunset On", file: "homeassistant/blueprints/[project]-sunset-on.yaml",
    //   description: "Turn on lamps 30 min before sunset." },
  ],
  packageFile: "homeassistant/package.yaml",
};
// ─────────────────────────────────────────────────────────────────────────────

function slugify(str) {
  return str.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
}

function bpImportUrl(rawUrl) {
  return `https://my.home-assistant.io/redirect/blueprint_import/?blueprint_url=${encodeURIComponent(rawUrl)}`;
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).catch(() => {
    const el = document.createElement('textarea');
    el.value = text; document.body.appendChild(el);
    el.select(); document.execCommand('copy');
    document.body.removeChild(el);
  });
}

function buildEntitySection(deviceName, segments) {
  const base = slugify(deviceName);
  const entities = [{ label: "Master light", id: `light.${base}` }];
  segments.forEach(seg => {
    const segSlug = seg.n ? slugify(seg.n) : `segment_${seg.id}`;
    entities.push({ label: seg.n || `Segment ${seg.id}`, id: `light.${base}_${segSlug}` });
  });

  const rows = entities.map(e => `
    <div class="entity-row">
      <span class="entity-label">${e.label}</span>
      <span class="entity-id" title="Click to copy" onclick="copyToClipboard('${e.id}');this.textContent='Copied!';setTimeout(()=>this.textContent='${e.id}',1500)">${e.id}</span>
    </div>`).join('');

  return `
    <div class="card">
      <h2>&#x1F4CB; Device: <strong>${deviceName}</strong></h2>
      <div class="entity-row">
        <span class="entity-label" style="color:#212121;font-weight:500">Expected HA entity IDs</span>
        <span class="copy-hint">click to copy</span>
      </div>
      ${rows}
      <p class="notice">
        These IDs are generated from your WLED device name and segment names.
        Verify in HA: <strong>Settings &rarr; Devices &amp; Services &rarr; WLED &rarr; ${deviceName}</strong>.
        <br>If they differ, rename your WLED segments or adjust the IDs in <code>package.yaml</code>.
      </p>
    </div>`;
}

function buildBlueprintSection(deviceName, segments) {
  if (!PROJECT.blueprints.length) {
    return `<div class="card"><h2>&#x1F9E9; Blueprints</h2><p style="font-size:.875rem;color:#757575">No blueprints configured for this project yet.</p></div>`;
  }
  const rows = PROJECT.blueprints.map(bp => {
    const rawUrl = `${PROJECT.repoBase}/${bp.file}`;
    const importUrl = bpImportUrl(rawUrl);
    return `
      <div class="blueprint-row">
        <div>
          <div class="bp-name">${bp.name}</div>
          <div class="bp-desc">${bp.description || ''}</div>
        </div>
        <a class="btn btn-primary" href="${importUrl}" target="_blank">Import in HA</a>
      </div>`;
  }).join('');

  return `
    <div class="card">
      <h2>&#x1F9E9; Blueprints</h2>
      ${rows}
      <p class="notice">
        Blueprints open directly in your Home Assistant instance via
        <a href="https://my.home-assistant.io" target="_blank">my.home-assistant.io</a>.
        You will be asked to pick entity IDs in the HA UI after import.
      </p>
    </div>`;
}

async function buildPackageSection(deviceName, segments) {
  const base = slugify(deviceName);
  let packageYaml = '';

  try {
    const r = await fetch(`${PROJECT.repoBase}/${PROJECT.packageFile}`);
    if (r.ok) {
      let text = await r.text();
      // Substitute entity IDs
      text = text.replace(/\[MASTER_LIGHT\]/g, `light.${base}`);
      segments.forEach((seg, idx) => {
        const segSlug = seg.n ? slugify(seg.n) : `segment_${seg.id}`;
        text = text.replace(new RegExp(`\\[SEGMENT_${idx + 1}\\]`, 'g'), `light.${base}_${segSlug}`);
      });
      packageYaml = text;
    }
  } catch (_) { /* network error — handled below */ }

  if (!packageYaml) {
    return `
      <div class="card">
        <h2>&#x1F4E6; HA Package</h2>
        <p class="notice">Could not fetch package.yaml from GitHub. Visit the
          <a href="${PROJECT.repoBase}/${PROJECT.packageFile}" target="_blank">raw file</a>
          and copy it manually.
        </p>
      </div>`;
  }

  const blob = new Blob([packageYaml], { type: 'text/yaml' });
  const url = URL.createObjectURL(blob);

  return `
    <div class="card">
      <h2>&#x1F4E6; HA Package</h2>
      <p style="font-size:.875rem;margin-bottom:.75rem">
        Downloads <code>package.yaml</code> with entity IDs pre-filled for <strong>${deviceName}</strong>.
      </p>
      <ol class="steps">
        <li><span class="step-num">1</span>Click Download below</li>
        <li><span class="step-num">2</span>Copy the file to <code>&lt;ha-config&gt;/packages/${slugify(PROJECT.name)}.yaml</code></li>
        <li><span class="step-num">3</span>Add to <code>configuration.yaml</code>: <code>homeassistant: packages: !include_dir_named packages</code></li>
        <li><span class="step-num">4</span>Restart Home Assistant</li>
      </ol>
      <br>
      <a class="btn btn-success" href="${url}" download="${slugify(PROJECT.name)}-ha-package.yaml">&#x2B07; Download package.yaml</a>
    </div>`;
}

function buildHacsBanner() {
  return `
    <div class="card">
      <h2>&#x2728; WLED Effects (optional)</h2>
      <p style="font-size:.875rem;margin-bottom:.75rem">
        Install <strong>hacs-wledext-effects</strong> to add context-aware LED effects driven by HA state
        (sensor visualisation, notifications, meter, alert, etc).
      </p>
      <a class="btn btn-outline" href="https://github.com/tamaygz/hacs-wledext-effects" target="_blank">View on GitHub</a>
    </div>`;
}

async function init() {
  const loading = document.getElementById('loading');
  const errorMsg = document.getElementById('error-msg');
  const main = document.getElementById('main');

  try {
    const [infoRes, stateRes] = await Promise.all([
      fetch('/json/info'),
      fetch('/json/state')
    ]);

    if (!infoRes.ok || !stateRes.ok) throw new Error('WLED API returned an error.');

    const info = await infoRes.json();
    const state = await stateRes.json();

    const deviceName = info.name || 'WLED';
    const segments = (state.seg || []).map((s, i) => ({ id: i, n: s.n || '' }));

    const [entityHtml, blueprintHtml, packageHtml] = await Promise.all([
      Promise.resolve(buildEntitySection(deviceName, segments)),
      Promise.resolve(buildBlueprintSection(deviceName, segments)),
      buildPackageSection(deviceName, segments),
    ]);

    loading.style.display = 'none';
    main.style.display = 'block';
    main.innerHTML = entityHtml + blueprintHtml + packageHtml + buildHacsBanner();

  } catch (err) {
    loading.style.display = 'none';
    errorMsg.style.display = 'block';
    errorMsg.innerHTML = `
      <strong>Could not connect to WLED API.</strong><br>
      ${err.message}<br><br>
      Make sure you are accessing this page from the WLED device IP
      (e.g. <code>http://reefs.local/ha-import.html</code>), not from a different host.`;
  }
}

init();
</script>
</body>
</html>
