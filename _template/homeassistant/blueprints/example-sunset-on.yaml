blueprint:
  name: "[Project] — Sunset On"
  description: >
    Turn on a WLED device at sunset. Designed for use with WLED projects
    in the esp-wled-projects repository.
    Configure the lights, brightness, and sunset offset.
  domain: automation
  input:
    light_entities:
      name: Light entities
      description: "One or more WLED light entities (segments) to control."
      selector:
        entity:
          multiple: true
          domain: light
    brightness_pct:
      name: Brightness (%)
      default: 40
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    sunset_offset:
      name: Offset before sunset
      description: "Minutes before sunset to activate."
      default: 30
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min

trigger:
  - platform: sun
    event: sunset
    offset: >-
      "-00:{{ '%02d' | format(sunset_offset | int) }}:00"

action:
  - service: light.turn_on
    target:
      entity_id: !input light_entities
    data:
      brightness_pct: !input brightness_pct

mode: single
