; WLED platformio_override.ini — curtaincinemalights project
; Place this alongside the WLED source repo's platformio.ini before building.
;
; Project: curtaincinemalights — Cinema curtain LED sync (SK6812 RGBW, ~180 LEDs)
; Controller: ESP8266 LOLIN D1 Mini v4
; Output: GPIO2 (D4) → 330 Ω series resistor → 74AHCT125 → SK6812 data
; WLED target: v0.15 (ESP8266 branch — legacy; do NOT use v16 ESP32 branch)

[env:d1_mini_curtaincinemalights]
extends = env:d1_mini

build_flags =
  ${env:d1_mini.build_flags}
  -D LEDPIN=2
  ; Do NOT set WLED_AP_PASS / WLED_WIFI_SSID here — configure via captive portal.

custom_usermods =
  ; Usermods disabled for v1.
  ; ESP8266 RAM is limited (80 KB heap) — keep usermods minimal.

monitor_speed = 115200
