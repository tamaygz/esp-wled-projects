blueprint:
  name: "Curtain Cinema Lights — Curtain Sync"
  description: >
    Sync the curtain LED strip effects to a motorized cover entity.
    While the curtain is moving, a Chase effect runs on both LED panels.
    When stopped mid-travel, State Sync fills LEDs proportionally to the
    curtain position. When fully open, an ambient Rainbow Wave plays.
    When fully closed, LEDs dim to near-off.
    Cinema mode (input_boolean) disables all curtain-driven effects.
  domain: automation
  source_url: https://raw.githubusercontent.com/tamaygz/esp-wled-projects/main/curtaincinemalights/homeassistant/blueprints/curtaincinemalights-curtain-sync.yaml
  input:
    curtain_entity:
      name: Curtain cover entity
      description: "The motorized curtain cover entity to track."
      selector:
        entity:
          domain: cover
    cinema_mode_boolean:
      name: Cinema Mode helper
      description: "input_boolean that disables curtain effects during cinema mode."
      default: input_boolean.cinema_mode_active
      selector:
        entity:
          domain: input_boolean
    state_sync_left:
      name: State Sync switch — Left Panel
      description: "hacs-wledext-effects State Sync switch for the Left Panel segment."
      selector:
        entity:
          domain: switch
    state_sync_right:
      name: State Sync switch — Right Panel
      description: "hacs-wledext-effects State Sync switch for the Right Panel segment."
      selector:
        entity:
          domain: switch
    chase_left:
      name: Chase switch — Left Panel
      description: "hacs-wledext-effects Chase switch for the Left Panel segment."
      selector:
        entity:
          domain: switch
    chase_right:
      name: Chase switch — Right Panel
      description: "hacs-wledext-effects Chase switch for the Right Panel segment."
      selector:
        entity:
          domain: switch
    ambient_rainbow:
      name: Ambient Rainbow switch
      description: "hacs-wledext-effects Rainbow Wave switch for the fully-open state."
      selector:
        entity:
          domain: switch
    master_light:
      name: Master light entity
      description: "WLED master light entity (light.curtaincinemalights)."
      selector:
        entity:
          domain: light

trigger:
  - platform: state
    entity_id: !input curtain_entity
    to:
      - "opening"
      - "closing"
      - "open"
      - "closed"
      - "stopped"

condition:
  - condition: state
    entity_id: !input cinema_mode_boolean
    state: "off"

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.state in ['opening', 'closing'] }}"
        sequence:
          - service: switch.turn_off
            target:
              entity_id:
                - !input state_sync_left
                - !input state_sync_right
          - service: switch.turn_on
            target:
              entity_id:
                - !input chase_left
                - !input chase_right

      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.state == 'open' }}"
        sequence:
          - service: switch.turn_off
            target:
              entity_id:
                - !input chase_left
                - !input chase_right
                - !input state_sync_left
                - !input state_sync_right
          - service: switch.turn_on
            target:
              entity_id: !input ambient_rainbow

      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.state == 'closed' }}"
        sequence:
          - service: switch.turn_off
            target:
              entity_id:
                - !input chase_left
                - !input chase_right
                - !input state_sync_left
                - !input state_sync_right
                - !input ambient_rainbow
          - service: light.turn_on
            target:
              entity_id: !input master_light
            data:
              brightness_pct: 5

      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.state == 'stopped' }}"
        sequence:
          - service: switch.turn_off
            target:
              entity_id:
                - !input chase_left
                - !input chase_right
          - service: switch.turn_on
            target:
              entity_id:
                - !input state_sync_left
                - !input state_sync_right

mode: single
