blueprint:
  name: "Reefs — Sunset On"
  description: >
    Turn on the Reefs driftwood lamps before sunset.
    Select the two lamp entities, brightness, and how many minutes before sunset to activate.
  domain: automation
  source_url: https://raw.githubusercontent.com/tamaygz/esp-wled-projects/main/reefs/homeassistant/blueprints/reefs-sunset-on.yaml
  input:
    lamp_1:
      name: Lamp 1
      description: "Light entity for Driftwood Lamp 1 (Segment 0)."
      selector:
        entity:
          domain: light
    lamp_2:
      name: Lamp 2
      description: "Light entity for Driftwood Lamp 2 (Segment 1)."
      selector:
        entity:
          domain: light
    brightness_pct:
      name: Brightness (%)
      default: 40
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    sunset_offset_minutes:
      name: Minutes before sunset
      default: 30
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min

variables:
  offset_str: >-
    {{ '-00:%02d:00' | format(sunset_offset_minutes | int) }}

trigger:
  - platform: sun
    event: sunset
    offset: !input sunset_offset_minutes

action:
  - service: light.turn_on
    target:
      entity_id:
        - !input lamp_1
        - !input lamp_2
    data:
      brightness_pct: !input brightness_pct
      effect: "Warm Ambient"

mode: single
