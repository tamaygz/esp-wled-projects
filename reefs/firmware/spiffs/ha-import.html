<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HA Import — Reefs</title>
  <style>
    :root {
      --accent: #1976d2;
      --ok: #388e3c;
      --warn: #f57c00;
      --bg: #f5f5f5;
      --card: #ffffff;
      --border: #e0e0e0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: #212121; padding: 1rem; }
    h1 { font-size: 1.4rem; color: var(--accent); margin-bottom: 0.25rem; }
    .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .card h2 { font-size: 1rem; margin-bottom: 0.75rem; color: #424242; }
    .entity-row { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0; border-bottom: 1px solid var(--border); font-size: 0.875rem; gap: 0.5rem; }
    .entity-row:last-child { border-bottom: none; }
    .entity-label { color: #757575; min-width: 120px; }
    .entity-id { font-family: monospace; background: #f3f4f6; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
    .entity-id:hover { background: #e3f2fd; }
    .copy-hint { font-size: 0.75rem; color: #9e9e9e; }
    .blueprint-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--border); gap: 0.5rem; }
    .blueprint-row:last-child { border-bottom: none; }
    .bp-name { font-size: 0.875rem; font-weight: 500; flex: 1; }
    .bp-desc { font-size: 0.8rem; color: #757575; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 500; text-decoration: none; cursor: pointer; border: none; transition: opacity .15s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .btn-success { background: var(--ok); color: #fff; }
    .notice { font-size: 0.8rem; color: #757575; margin-top: 0.75rem; padding: 0.5rem; background: #f9f9f9; border-radius: 4px; }
    .notice a { color: var(--accent); }
    #loading { text-align: center; padding: 2rem; color: #757575; }
    #error-msg { background: #ffebee; border: 1px solid #ffcdd2; border-radius: 8px; padding: 1rem; color: #c62828; display: none; }
    .steps { list-style: none; }
    .steps li { padding: 0.35rem 0; font-size: 0.875rem; }
    .step-num { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; background: var(--accent); color: #fff; border-radius: 50%; font-size: 0.7rem; font-weight: 600; margin-right: 6px; }
  </style>
</head>
<body>

<h1>&#x1F4A1; HA Import — Reefs</h1>
<p class="subtitle">Driftwood ambient lamps &mdash; SK6812 RGBW, ESP32-WROOM-32</p>

<div id="loading">Reading device info&hellip;</div>
<div id="error-msg"></div>
<div id="main" style="display:none"></div>

<script>
// ─── Project config ───────────────────────────────────────────────────────────
const REPO_BASE = "https://raw.githubusercontent.com/tamaygz/esp-wled-projects/main/reefs";
const BLUEPRINTS = [
  {
    name: "Sunset On",
    file: "homeassistant/blueprints/reefs-sunset-on.yaml",
    description: "Turn on lamps 30 min before sunset at a chosen brightness."
  },
  {
    name: "Night Dim",
    file: "homeassistant/blueprints/reefs-night-dim.yaml",
    description: "Dim to Night Glow mode at a configurable time."
  },
  {
    name: "Scheduled Off",
    file: "homeassistant/blueprints/reefs-off.yaml",
    description: "Turn off all lamps at a configurable time."
  },
];
const PACKAGE_FILE = "homeassistant/package.yaml";
const PROJECT_SLUG = "reefs";
// ─────────────────────────────────────────────────────────────────────────────

function slugify(str) {
  return (str || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
}

function bpImportUrl(rawUrl) {
  return `https://my.home-assistant.io/redirect/blueprint_import/?blueprint_url=${encodeURIComponent(rawUrl)}`;
}

function copyText(el, text) {
  navigator.clipboard.writeText(text).catch(() => {
    const t = document.createElement('textarea');
    t.value = text; document.body.appendChild(t); t.select();
    document.execCommand('copy'); document.body.removeChild(t);
  });
  const orig = el.textContent;
  el.textContent = 'Copied!';
  setTimeout(() => el.textContent = orig, 1500);
}

function buildEntitySection(deviceName, segments) {
  const base = slugify(deviceName);
  const entities = [{ label: "Master light", id: `light.${base}` }];
  segments.forEach((seg, i) => {
    const segSlug = seg.n ? slugify(seg.n) : `segment_${i}`;
    entities.push({ label: seg.n || `Segment ${i}`, id: `light.${base}_${segSlug}` });
  });
  entities.push({ label: "Preset selector", id: `select.${base}_preset` });

  const rows = entities.map(e => `
    <div class="entity-row">
      <span class="entity-label">${e.label}</span>
      <span class="entity-id" title="Click to copy" onclick="copyText(this,'${e.id}')">${e.id}</span>
    </div>`).join('');

  return `
    <div class="card">
      <h2>Device: <strong>${deviceName}</strong></h2>
      <div class="entity-row">
        <span class="entity-label" style="color:#212121;font-weight:500">Expected HA entity IDs</span>
        <span class="copy-hint">click to copy</span>
      </div>
      ${rows}
      <p class="notice">
        Verify in HA: <strong>Settings &rarr; Devices &amp; Services &rarr; WLED &rarr; ${deviceName}</strong>.<br>
        If names differ, rename WLED segments in the WLED web UI to match, or adjust <code>package.yaml</code>.
      </p>
    </div>`;
}

function buildBlueprintSection() {
  const rows = BLUEPRINTS.map(bp => {
    const rawUrl = `${REPO_BASE}/${bp.file}`;
    const importUrl = bpImportUrl(rawUrl);
    return `
      <div class="blueprint-row">
        <div>
          <div class="bp-name">${bp.name}</div>
          <div class="bp-desc">${bp.description}</div>
        </div>
        <a class="btn btn-primary" href="${importUrl}" target="_blank">Import in HA</a>
      </div>`;
  }).join('');

  return `
    <div class="card">
      <h2>&#x1F9E9; Blueprints</h2>
      ${rows}
      <p class="notice">
        Opens HA via <a href="https://my.home-assistant.io" target="_blank">my.home-assistant.io</a>.
        You pick entity IDs and settings in the HA UI after import.
      </p>
    </div>`;
}

async function buildPackageSection(deviceName, segments) {
  const base = slugify(deviceName);
  let text = '';
  try {
    const r = await fetch(`${REPO_BASE}/${PACKAGE_FILE}`);
    if (r.ok) {
      text = await r.text();
      // Substitute entity IDs based on actual device data
      text = text.replace(/light\.reefs(?=\b)/g, `light.${base}`);
      segments.forEach((seg, i) => {
        const segSlug = seg.n ? slugify(seg.n) : `segment_${i}`;
        // Replace reefs_lamp_1 / _2 with actual slugs (positional)
        const oldSlug = i === 0 ? 'lamp_1' : i === 1 ? 'lamp_2' : `lamp_${i + 1}`;
        const oldId = `light.reefs_${oldSlug}`;
        const newId = `light.${base}_${segSlug}`;
        text = text.replace(new RegExp(oldId.replace('.', '\\.'), 'g'), newId);
      });
      text = text.replace(/select\.reefs_/g, `select.${base}_`);
      text = text.replace(/sensor\.reefs_/g, `sensor.${base}_`);
    }
  } catch (_) { /* fallback below */ }

  if (!text) {
    return `
      <div class="card">
        <h2>&#x1F4E6; HA Package</h2>
        <p class="notice">Could not fetch package.yaml.
          <a href="${REPO_BASE}/${PACKAGE_FILE}" target="_blank">Open raw file</a> and copy manually.
        </p>
      </div>`;
  }

  const blob = new Blob([text], { type: 'text/yaml' });
  const url = URL.createObjectURL(blob);

  return `
    <div class="card">
      <h2>&#x1F4E6; HA Package</h2>
      <p style="font-size:.875rem;margin-bottom:.75rem">
        Pre-filled <code>package.yaml</code> for device <strong>${deviceName}</strong>
        with helpers, scripts, and automations.
      </p>
      <ol class="steps">
        <li><span class="step-num">1</span> Download below</li>
        <li><span class="step-num">2</span> Copy to <code>&lt;ha-config&gt;/packages/reefs.yaml</code></li>
        <li><span class="step-num">3</span> In <code>configuration.yaml</code>: <code>homeassistant: packages: !include_dir_named packages</code></li>
        <li><span class="step-num">4</span> Restart Home Assistant</li>
      </ol>
      <br>
      <a class="btn btn-success" href="${url}" download="reefs-ha-package.yaml">&#x2B07; Download package.yaml</a>
    </div>`;
}

async function init() {
  const loading = document.getElementById('loading');
  const errorMsg = document.getElementById('error-msg');
  const main = document.getElementById('main');

  try {
    const [infoRes, stateRes] = await Promise.all([
      fetch('/json/info'),
      fetch('/json/state')
    ]);
    if (!infoRes.ok || !stateRes.ok) throw new Error('WLED API error.');

    const info = await infoRes.json();
    const state = await stateRes.json();
    const deviceName = info.name || 'WLED';
    const segments = (state.seg || []).map((s, i) => ({ id: i, n: s.n || '' }));

    const packageHtml = await buildPackageSection(deviceName, segments);

    loading.style.display = 'none';
    main.style.display = 'block';
    main.innerHTML =
      buildEntitySection(deviceName, segments) +
      buildBlueprintSection() +
      packageHtml +
      `<div class="card">
        <h2>&#x2728; WLED Effects (optional)</h2>
        <p style="font-size:.875rem;margin-bottom:.75rem">
          Install <strong>hacs-wledext-effects</strong> for context-aware LED effects driven by HA state.
        </p>
        <a class="btn btn-outline" href="https://github.com/tamaygz/hacs-wledext-effects" target="_blank">View on GitHub</a>
      </div>`;
  } catch (err) {
    loading.style.display = 'none';
    errorMsg.style.display = 'block';
    errorMsg.innerHTML = `
      <strong>Could not connect to WLED API.</strong><br>${err.message}<br><br>
      Open this page from the WLED device:
      <code>http://reefs.local/ha-import.html</code>`;
  }
}

init();
</script>
</body>
</html>
