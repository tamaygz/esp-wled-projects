; WLED platformio_override.ini — reefs project
; Place this alongside the WLED source repo's platformio.ini before building.
;
; Project: reefs — driftwood ambient lamps (2 × SK6812 RGBW, 60 LEDs each)
; Controller: ESP32-WROOM-32
; Outputs: GPIO16 (Lamp 1), GPIO17 (Lamp 2)
; WLED target: v0.15+

[env:reefs]
extends = env:esp32dev

build_flags =
  ${env:esp32dev.build_flags}
  -D LEDPIN=16
  ; Second output configured in WLED web UI (GPIO17), not via build flag.
  ; Do NOT set WLED_AP_PASS / WLED_WIFI_SSID here — configure via captive portal.

custom_usermods =
  ; Usermods disabled for v1 (no audio-reactive, no temperature sensor).
  ; Enable here if adding hardware in a future revision:
  ; audioreactive
  ; Temperature
